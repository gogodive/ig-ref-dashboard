# 레퍼런스(타사) 인스타 분석기 설정
apify:
  actor: apify~instagram-scraper
  results_type: posts        # posts = 게시물 상세(조회수 포함). details는 조회수가 없어 사용 금지
  # 일일 수집 = 감지 창(최신 posts_limit개) + 창 밖 동결 전 게시물 URL 직접 배치.
  # 동결(30일)된 게시물을 매일 다시 사지 않기 위한 구조 — 창 30 시절 일 ~1,147건 중
  # 58%가 동결분 재구매였다. 창 전체가 처음 보는 글이면(다작·고정핀 잠식) 포화로 보고
  # saturated_limit 로 재수집한다. 팔로워는 주 1회(followers_weekday)만 조회.
  posts_limit: 10            # 새 게시물 감지 창
  saturated_limit: 30        # 감지 창 포화 시 재수집 개수
  backfill_limit: 180        # --backfill 1회 실행 시 계정당 수집 개수

display_limit: 180           # 데이터로 보관할 계정당 게시물 수 (중앙값·히트 판정 근거)
render_limit: 60             # 대시보드에 그릴 계정당 카드 수 (히트작은 오래돼도 항상 포함)

# 썸네일은 저장소에 보관하되 CDN 으로 서빙한다.
# Pages 아티팩트에 5,800여 파일을 넣으면 배포가 10분 제한(상향 불가)을 넘겨 실패한다.
thumb_base_url: "https://cdn.jsdelivr.net/gh/gogodive/ig-ref-dashboard@main/"
freeze_days: 30              # 게시 후 이 일수가 지나면 지표 동결(확정)
# 🔥 배수 기준은 deep_analysis.ratio 와 같게 맞춘다.
# 다만 🔥 는 기간을 안 보고, 심층분석은 recent_days 안쪽만 받는다 —
# 그래서 오래된 🔥 에는 리포트 버튼이 안 붙는다 (의도된 차이).
# 공동 게시물이 **남의 계정 글**이고 그 계정을 모니터링하지 않으면 배수를 아예
# 내지 않는다(collab-external) — 조회수가 통째로 남의 오디언스라 우리 중앙값으로
# 나눌 근거가 없다. 이 예외 없이 돌렸을 때 372.8배·239.4배가 나왔고 전부 가짜였다.
hot_ratio: 3.0               # 조회수가 계정 릴스 중앙값의 이 배수 이상이면 🔥

# 릴스 심층분석(프레임 단위 리포트) 대상 기준 — 맥의 analyze-reference-reel 스킬이 소비
deep_analysis:
  ratio: 3.0                 # 계정 릴스 중앙값 대비 배수
  recent_days: 365           # 최근 1년 이내 게시물만
  # 게시 직후 배수는 안 굳었다 — D+3 에 3배로 보이던 게 D+30 에 1.5배가 되기도 한다.
  # 이 일수가 지나야 큐에 넣는다 (0 이면 즉시).
  min_age_days: 7
  notion_db_id: cc87460d41e34515a70084e1672f67b6   # 🎯 성과 좋은 릴스 분석

followers_weekday: 0         # 팔로워 수 갱신 요일 (0=월요일) — 하루로 변하는 값이 아니라 주 1회

claude:
  model: claude-sonnet-4-6
  max_tokens_post: 500       # 게시물 한줄 분석 (히트 AI 요약·주간 종합은 폐지)

notion:
  accounts_db_id: 85c2aeea0a2949b0885e3959e1bc098d   # 레퍼런스 계정 (분석 대상)
  log_db_id: bc6a309f0ccc430dac75809d6582efa1        # 레퍼런스 분석 로그
  hub_page_id: 37d39eba97ed81abb7c1c835753befc3      # 허브 페이지 (최상단 실행상태 콜아웃)
  version: "2022-06-28"
