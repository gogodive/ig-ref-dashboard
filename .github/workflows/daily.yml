name: daily-ref-analysis

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 07:30 KST (자사 대시보드와 30분 시차)
  workflow_dispatch:
    inputs:
      backfill:
        description: "1회성 백필 (계정당 180개 수집, 과거 히트 분석)"
        type: boolean
        default: false
      only:
        description: "특정 username만 (콤마 구분, 비우면 전체)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ref-analysis
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main 을 명시해야 실행 '생성 시점'이 아닌 '시작 시점'의 최신 커밋을 가져온다.
      # (연속 실행 시 앞 실행이 커밋한 data/ 를 놓쳐 옛 데이터로 렌더되는 문제 방지)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect, analyze and render
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -m src.main ${{ inputs.backfill && '--backfill' || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      # 실행이 도는 동안 로컬(심층분석 스킬)이 data/hit_queue.json 을 push 하면
      # rebase 가 충돌해 커밋도 배포도 통째로 죽는다. 이 파일만은 원격이 옳다 —
      # 분석 완료 상태(status·notion_page_id)가 거기 있고, 러너가 갱신한 지표와
      # 새로 편입된 히트는 다음 실행이 어차피 다시 계산한다.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data thumbs
          git diff --cached --quiet || git commit -m "chore: daily data update"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              unmerged=$(git diff --name-only --diff-filter=U)
              others=$(echo "$unmerged" | grep -v '^data/hit_queue\.json$' || true)
              if [ -z "$unmerged" ] || [ -n "$others" ]; then
                echo "::error::rebase 중단 (충돌: ${unmerged:-없음})"
                git rebase --abort || true
                exit 1
              fi
              git checkout --ours data/hit_queue.json
              git add data/hit_queue.json
              # 충돌 파일이 유일한 변경이었으면 커밋이 비므로 건너뛴다
              if git diff --cached --quiet; then
                git rebase --skip
              else
                GIT_EDITOR=true git rebase --continue
              fi
            fi
            git push && exit 0
            echo "push 경합 — 재시도 $attempt/3"
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 썸네일 보관본(5,800여 파일)이 붙으면서 기본 10분 제한을 넘겨 배포가
      # 중단된 적이 있다. 파일 수가 많을수록 Pages 큐 처리가 길어진다.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30분
