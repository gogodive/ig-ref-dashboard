# 임시 검증 워크플로 — 확인 후 삭제한다.
# directUrls(게시물 URL 직접 조회)가 릴스 조회수·owner/coauthors 를 주는지 실물 확인.
# details 모드가 조회수를 안 줬던 전례가 있어, 수집 효율화(URL 배치) 착수 전 검증.
name: verify-directurls
on: workflow_dispatch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch 3 posts by URL
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'EOF'
          import json
          from src.apify_client import _run_actor, _map_post

          URLS = [
              "https://www.instagram.com/p/Dbk3kyaPV2r/",   # ban.yuju 릴스 (저장 조회수 142,900)
              "https://www.instagram.com/p/DbiXmuEviJu/",   # funkihun↔soomsamz 협업 릴스
              "https://www.instagram.com/p/DVdRN71j_mz/",   # andar_kr 이미지
          ]
          items = _run_actor("apify~instagram-scraper", {
              "directUrls": URLS,
              "resultsType": "posts",
              "resultsLimit": len(URLS),
              "addParentData": False,
          }, timeout_s=300)
          print(f"=== 응답 {len(items)}건 ===")
          for it in items:
              p = _map_post(it)
              print(json.dumps({
                  "post_id": p["post_id"], "product": p["product"],
                  "views": p["metrics"]["views"], "likes": p["metrics"]["likes"],
                  "comments": p["metrics"]["comments"],
                  "owner": p["owner"], "coauthors": p["coauthors"],
                  "posted_at": p["posted_at"], "permalink": p["permalink"],
                  "raw_keys_views": {k: it.get(k) for k in
                      ("videoPlayCount", "videoViewCount", "videoViews",
                       "igPlayCount", "playCount")},
              }, ensure_ascii=False))
          EOF
